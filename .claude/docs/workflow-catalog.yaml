# Workflow Catalog
# Used by /help to determine where a user is and what comes next.
#
# Artifact checks:
#   glob: file glob pattern — complete if ≥1 file matches (or min_count)
#   pattern: text pattern that must appear in the file (checked after glob)
#   min_count: minimum matching files required (default: 1)
#   note: human-readable fallback when completion can't be auto-detected
#   any_of: list of alternative {glob, pattern} specs — the step is complete if
#           ANY one of them matches. Use when a setting has migrated and may
#           legitimately live in either the new or the legacy location.
#
# required: true → blocks progression to next phase (shown as REQUIRED)
# required: false → optional enhancement (shown as OPTIONAL)
# repeatable: true → runs multiple times (one per system, change, etc.)
#
# Phase gates (/gate-check): verdicts are ADVISORY — they guide the decision
# but never hard-block advancement. The user always decides whether to proceed.

phases:

  concept:
    label: "Concept"
    description: "Develop your game idea into a documented concept"
    next_phase: systems-design
    steps:
      - id: brainstorm
        name: "Brainstorm"
        command: /brainstorm
        required: false
        description: "Explore the game concept using MDA, verb-first, and player psychology frameworks"

      - id: engine-setup
        name: "Engine Setup"
        command: /setup-engine
        required: true
        # v1.1: engine.name in project.yaml is the primary source; technical-
        # preferences.md is the legacy fallback. Checking only the legacy file
        # made a correctly-configured project fail this REQUIRED gate.
        artifact:
          any_of:
            - glob: "project.yaml"
              pattern: "name:[[:space:]]*(Godot|Unity|Unreal)"
            # technical-preferences.md writes "- **Engine**: Godot 4.6", so the
            # pattern must clear the bold markers. The previous "Engine: [^[]"
            # required a literal "Engine: " and therefore never matched any
            # file /setup-engine produces. The [^[] guard rejects the
            # "[TO BE CONFIGURED]" placeholder.
            - glob: ".claude/docs/technical-preferences.md"
              pattern: "\\*\\*Engine\\*\\*: [^[]"
        description: "Configure engine, pin version, set naming conventions and performance budgets"

      - id: game-concept
        name: "Game Concept Document"
        command: /brainstorm
        required: true
        artifact:
          glob: "design/gdd/game-concept.md"
        description: "Formalize concept with pillars, MDA analysis, and scope tiers"

      - id: design-review-concept
        name: "Concept Review"
        command: /design-review
        required: false
        description: "Validate the game concept (recommended before proceeding)"

      - id: art-bible
        name: "Art Bible"
        command: /art-bible
        required: true
        artifact:
          glob: "design/art/art-bible.md"
        description: "Author the visual identity specification (9 sections). Uses the Visual Identity Anchor produced by /brainstorm. Run after game concept is formed, before systems design."

      - id: map-systems
        name: "Systems Map"
        command: /map-systems
        required: true
        artifact:
          glob: "design/gdd/systems-index.md"
        description: "Decompose concept into systems with dependency ordering and priority tiers"

  systems-design:
    label: "Systems Design"
    description: "Author a GDD for each system in the systems index"
    next_phase: technical-setup
    steps:
      - id: design-system
        name: "System GDDs"
        command: /design-system
        required: true
        repeatable: true
        artifact:
          note: "Check design/gdd/systems-index.md — each MVP system needs Status: Approved"
        description: "Author per-system GDDs (guided, section-by-section). Run once per system."

      - id: design-review
        name: "Per-System Design Review"
        command: /design-review
        required: true
        repeatable: true
        description: "Validate each GDD (required sections per workflow tier, no MAJOR REVISION verdict). Run per system."

      - id: review-all-gdds
        name: "Cross-GDD Review"
        command: /review-all-gdds
        required: true
        artifact:
          glob: "design/gdd/gdd-cross-review-*.md"
        description: "Holistic consistency check + design theory review across all GDDs simultaneously"

      - id: consistency-check
        name: "Consistency Check"
        command: /consistency-check
        required: false
        repeatable: true
        description: "Scan all GDDs for contradictions, undefined references, and mechanic conflicts. Run after /review-all-gdds, and again any time a GDD is added or revised mid-project."

  technical-setup:
    label: "Technical Setup"
    description: "Architecture decisions, visual identity specification, accessibility foundations, engine validation"
    next_phase: pre-production
    steps:
      - id: create-architecture
        name: "Architecture Document"
        command: /create-architecture
        required: true
        artifact:
          glob: "docs/architecture/architecture.md"
        description: "Author the master architecture document covering all systems"

      - id: architecture-decision
        name: "Architecture Decisions (ADRs)"
        command: /architecture-decision
        required: true
        repeatable: true
        artifact:
          glob: "docs/architecture/adr-*.md"
          min_count: 3
        description: "Document key technical decisions as ADRs. Minimum 3 Foundation-layer ADRs required."

      - id: architecture-review
        name: "Architecture Review"
        command: /architecture-review
        required: true
        artifact:
          glob: "docs/architecture/architecture-review-*.md"
        description: "Validate completeness, dependency ordering, engine compatibility"

      - id: control-manifest
        name: "Control Manifest"
        command: /create-control-manifest
        required: true
        artifact:
          glob: "docs/architecture/control-manifest.md"
        description: "Flat programmer rules sheet generated from all Accepted ADRs"

      - id: accessibility-doc
        name: "Accessibility Requirements"
        # This step had no `command:` at all -- the only artifact entry in the
        # catalog that named no producer. It was REQUIRED, so the Technical
        # Setup -> Pre-Production gate could never pass, and the remediation
        # every skill printed ("run /ux-design") wrote into design/ux/ where
        # this glob does not look. /ux-design now has an `accessibility` mode.
        command: /ux-design
        required: true
        artifact:
          glob: "design/accessibility-requirements.md"
        description: "Run `/ux-design accessibility`. Commit accessibility tier (Basic/Standard/Comprehensive/Exemplary) and feature matrix. UX specs (Phase 4) reference this tier."

  pre-production:
    label: "Pre-Production"
    description: "Visual entity inventory, UX specs, asset specs, prototype the core mechanic, define stories, validate fun"
    next_phase: production
    steps:
      - id: entity-inventory
        name: "Visual Entity & Screen Inventory"
        command: /asset-spec
        required: false
        artifact:
          glob: "design/assets/entity-inventory.md"
        description: "Enumerate everything the game needs visually: entities (characters, enemies, buildings, environment pieces), UI screens, HUD elements, panels. Run /asset-spec with no arguments to start a collaborative inventory session — brief or detailed based on your responses. Reads GDDs and art bible to propose a starting list; you add, remove, and adjust. Becomes the source of truth for all art and UX work. Not required if the game has very few distinct visual elements."

      - id: asset-spec
        name: "Asset Specs"
        command: /asset-spec
        required: false
        repeatable: true
        artifact:
          glob: "design/assets/asset-manifest.md"
        description: "Generate per-asset visual specifications and AI generation prompts. Run once per entity, system, level, or character. If no source doc exists, /asset-spec interviews you inline — no narrative document required."

      - id: ux-design
        name: "UX Specs (key screens)"
        command: /ux-design
        required: true
        repeatable: true
        artifact:
          glob: "design/ux/*.md"
          min_count: 3
        description: "Author UX specs for the screens identified in the entity inventory (or GDDs if no inventory). Minimum required: main menu, core gameplay HUD, pause menu. Add more screens as the inventory identifies them. Reads input method and platform from technical-preferences.md."

      - id: ux-review
        name: "UX Review"
        command: /ux-review
        required: true
        description: "Validate all key screen UX specs for GDD alignment and accessibility tier compliance. Run before creating changes."

      - id: prototype
        name: "Prototype"
        command: /prototype
        required: false
        artifact:
          # /prototype writes prototypes/[name]-concept/REPORT.md -- it has never
          # written a README. The `-concept` suffix is load-bearing: /vertical-slice
          # writes the same REPORT.md basename under `-vertical-slice`, so a bare
          # `prototypes/*/REPORT.md` here would let either step satisfy the other.
          glob: "prototypes/*-concept/REPORT.md"
          min_count: 1
        description: "Build a throwaway prototype to validate the core mechanic is fun before committing to full production. Recommended for first-time mechanics or high-risk design decisions. Solo devs with proven concepts may skip."

      - id: design-system
        name: "Design Capabilities"
        command: /design-system
        required: true
        repeatable: true
        artifact:
          glob: "openspec/specs/*/spec.md"
          min_count: 1
        description: "Write one capability spec per game system — a capability IS the system's GDD. Run per layer: /design-system layer:foundation, then /design-system layer:core"

      - id: create-changes
        name: "Create Changes"
        command: /create-changes
        required: true
        repeatable: true
        artifact:
          glob: "openspec/changes/*/tasks.md"
          note: "A change under openspec/changes/<id>/ is the unit of work — the successor to a story"
        description: "Break a capability into implementable changes. Run per capability: /create-changes [system]"

      - id: test-setup
        name: "Test Framework Setup"
        command: /test-setup
        required: false
        artifact:
          note: "Check tests/ directory for engine-specific test framework scaffold"
        description: "Scaffold the test framework and CI pipeline once before implementation begins. Leads to /test-helpers for fixture generation, /qa-plan per capability, and /smoke-check per change set."

      - id: vertical-slice
        name: "Vertical Slice"
        command: /vertical-slice
        required: false
        artifact:
          # Must stay scoped to `-vertical-slice`: the untethered form matched
          # /prototype's concept report, so running only /prototype silently
          # marked the vertical slice complete and skipped the validation the
          # Pre-Production → Production gate exists to require.
          glob: "prototypes/*-vertical-slice/REPORT.md"
          min_count: 1
        description: "Build and playtest a vertical slice — a complete end-to-end pass through the core loop. Recommended before committing capabilities and changes to production. Skipping is a valid solo dev call but increases risk of late-stage design pivots. If built, must be played and documented before advancing."

  production:
    label: "Production"
    description: "OpenSpec change development — propose, apply, archive"
    next_phase: polish
    steps:
      - id: create-changes
        name: "Plan Changes"
        command: /create-changes
        required: true
        repeatable: true
        artifact:
          glob: "openspec/changes/*/tasks.md"
          note: "In-flight changes are the unit of work — inspect them with /opsx:explore or 'openspec list'"
        description: "Plan the next batch of changes against the capability specs"

      - id: change-readiness
        name: "Change Readiness Check"
        command: /change-readiness
        required: false
        description: "Validate a change is implementation-ready before a developer picks it up"

      - id: implement
        name: "Implement Change"
        command: /dev-change
        required: true
        repeatable: true
        artifact:
          note: "Check src/ for active code and openspec/changes/*/tasks.md for checked-off tasks"
        description: "Pick the next ready change and implement it with /dev-change [change-id]. Routes to the correct programmer agent."

      - id: code-review
        name: "Code Review"
        command: /code-review
        required: false
        repeatable: true
        description: "Architectural code review after each change implementation. Run after /dev-change, before /change-done."

      - id: change-done
        name: "Change Done Review"
        command: /change-done
        required: true
        repeatable: true
        artifact:
          note: "Archiving is /opsx:archive — it merges the change's delta into openspec/specs/<system>/spec.md"
        description: "Verify all acceptance criteria, check spec/ADR deviations, then archive the change"

      - id: qa-plan
        name: "QA Plan"
        command: /qa-plan
        required: false
        repeatable: true
        description: "Generate a QA test plan per capability or change set. Run /qa-plan [system]. Produces test cases for /smoke-check, /regression-suite, and /test-evidence-review."

      - id: bug-report
        name: "Bug Report / Triage"
        command: /bug-report
        required: false
        repeatable: true
        description: "Log and prioritize bugs found during implementation. /bug-report creates a structured report; /bug-triage prioritizes the open backlog."

      - id: retrospective
        name: "Retrospective"
        command: /retrospective
        required: false
        repeatable: true
        description: "Review what worked and what to change. Run at the end of a change set or milestone, before planning the next."

      - id: team-feature
        name: "Team Orchestration (optional)"
        required: false
        repeatable: true
        description: "Coordinate multiple agents on a complex feature. Use: /team-combat, /team-narrative, /team-ui, /team-audio, /team-level, /team-live-ops, /team-qa. Run when a feature spans multiple agent domains."

      - id: scope-check
        name: "Scope Check"
        command: /scope-check
        required: false
        repeatable: true
        artifact:
          glob: "openspec/changes/*/tasks.md"
          note: "Run when changes are added mid-flight, or before a retrospective"
        description: "Detect scope creep by comparing current change-set scope to the capability spec. Run (a) when changes are added mid-flight, or (b) before a retrospective."

      - id: change-status
        name: "Change Status"
        command: openspec status
        required: false
        description: "Quick snapshot of in-flight change progress, read from the tasks.md checkboxes"

  polish:
    label: "Polish"
    description: "Performance, balance, playtesting, bug fixing"
    next_phase: release
    steps:
      - id: perf-profile
        name: "Performance Profile"
        command: /perf-profile
        required: false
        description: "Profile and optimize CPU/GPU/memory bottlenecks"

      - id: balance-check
        name: "Balance Check"
        command: /balance-check
        required: false
        description: "Analyze game balance formulas and data for outliers and broken progressions"

      - id: asset-audit
        name: "Asset Audit"
        command: /asset-audit
        required: false
        description: "Verify naming conventions, file format standards, and size budgets"

      - id: playtest-polish
        name: "Playtest Sessions (×3)"
        command: /playtest-report
        required: true
        artifact:
          # /playtest-report writes production/qa/playtests/, not production/playtests/.
          # The old glob matched nothing on every project, so this REQUIRED step
          # read as 0/3 forever no matter how many playtests were actually run.
          glob: "production/qa/playtests/*.md"
          min_count: 3
        description: "Cover: new player experience, mid-game systems, difficulty curve"

      - id: team-polish
        name: "Polish Team Pass"
        command: /team-polish
        required: true
        description: "Coordinated polish pass across performance, audio, visual, and UX"

  release:
    label: "Release"
    description: "Launch preparation, certification, and ship"
    next_phase: null
    steps:
      - id: release-checklist
        name: "Release Checklist"
        command: /release-checklist
        required: true
        description: "Pre-release validation across all departments: code, content, store, legal"

      - id: patch-notes
        name: "Patch Notes"
        command: /patch-notes
        required: false
        description: "Generate player-facing patch notes from git history and change data"

      - id: changelog
        name: "Changelog"
        command: /changelog
        required: false
        description: "Auto-generate internal changelog from commits, changes, and design docs"

      - id: launch-checklist
        name: "Launch Checklist"
        command: /launch-checklist
        required: true
        description: "Final launch readiness — last gate before shipping to players"
